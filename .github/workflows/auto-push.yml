name: Auto Push Governance + Tag

on:
  workflow_dispatch:   # กด Run workflow ใน GitHub UI ได้
  push:
    branches:
      - main

permissions:
  contents: write      # จำเป็นสำหรับ push + tag

jobs:
  push-governance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0              # ดึง history ทั้งหมด (จำเป็นสำหรับ tag)
          persist-credentials: true   # เก็บ token สำหรับ push

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure governance files exist
        run: |
          test -f OWNERS.md || echo "WARN: OWNERS.md missing"
          test -f MILESTONES.md || echo "WARN: MILESTONES.md missing"
          test -f DECISIONS.md || echo "WARN: DECISIONS.md missing"
          test -f PREFLIGHT.md || echo "WARN: PREFLIGHT.md missing"
          test -f specs/TRUST_ANCHORS.md || echo "WARN: TRUST_ANCHORS.md missing"

      - name: Commit governance files (if changed)
        run: |
          git add OWNERS.md MILESTONES.md DECISIONS.md PREFLIGHT.md specs/TRUST_ANCHORS.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(M0): sync governance files"
          fi

      - name: Create tag M0-COMPLETE (if not exists)
        run: |
          if ! git rev-parse -q --verify "refs/tags/M0-COMPLETE" >/dev/null 2>&1; then
            git tag M0-COMPLETE
            echo "Tag M0-COMPLETE created"
          else
            echo "Tag M0-COMPLETE already exists"
          fi

      - name: Push commits and tags
        run: |
          git push origin main
          git push origin --tags
