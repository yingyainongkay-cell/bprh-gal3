name: Auto Push Governance + Tag

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  push-governance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit existing governance files (if any)
        run: |
          # เพิ่มเฉพาะไฟล์ที่มีอยู่จริง
          for f in OWNERS.md MILESTONES.md DECISIONS.md PREFLIGHT.md specs/TRUST_ANCHORS.md; do
            if [ -f "$f" ]; then
              git add "$f"
            else
              echo "SKIP: $f not found"
            fi
          done

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(M0): sync governance files"
          fi

      - name: Create tag M0-COMPLETE (if not exists)
        run: |
          if ! git rev-parse -q --verify "refs/tags/M0-COMPLETE" >/dev/null 2>&1; then
            git tag M0-COMPLETE
            echo "Tag M0-COMPLETE created"
          else
            echo "Tag M0-COMPLETE already exists"
          fi

      - name: Push commits and tags
        run: |
          git push origin main
          git push origin --tags
