openapi: 3.0.3
info:
  title: GAL-3 API
  version: 2.0.0-m2.1
  description: |
    API contract for GAL-3 (BPRH/SEOS), revision 2 (M2 spec freeze amended by M2.1,
    2026-11-11). Companion to FROZEN_SPEC_GAL3.md rev 2; section references
    (for example "§2") and gap identifiers (OG-nn) point into that file.

    The sources define four capabilities (authorization, per-tenant hash-chained
    audit log, Ed25519 signing, rate limiting), not endpoints. Paths, the /v1
    prefix, parameter names, status-code mapping and error body shape are
    provisional (OG-12). Fields mirror the audit schema and the M2.1 decisions.

    Applies to every operation: a valid JWT (EdDSA) is required; the OPA decision
    must be allow = true (default deny); and a rate-limit token is consumed per
    request. The failure mode when Redis is unavailable is stated per operation in
    x-failure-mode (A1, S1, S2 fail-closed; A2, A3 fail-open).

    All audit operations act on the caller's own tenant, taken from the token.
    No audit operation takes a tenant parameter.
servers:
  - url: /
    description: Relative to the deployment host. Deployment topology is not specified (OG-13).
tags:
  - name: Audit
    description: Per-tenant hash-chained audit log.
  - name: Signatures
    description: Ed25519 sign and verify with registry-resolved keys.
security:
  - bearerAuth: []
paths:
  /v1/audit/events:
    post:
      tags: [Audit]
      operationId: appendAuditEvent
      summary: Append an audit event to the caller's tenant chain
      description: |
        Adds one row to the append-only audit table. The server takes tenant_id from
        the token, assigns sequence and ts, sets actor to the token's sub claim, and
        computes prev_hash and hash (SHA-256 over the JCS serialization of ts, actor,
        action, payload and prev_hash). Appends are serialized per tenant; the
        mechanism is unspecified (OG-18).
      x-spec-ref: "FROZEN_SPEC_GAL3.md §2 (A1), §3.3"
      x-failure-mode: fail-closed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditEventCreate'
      responses:
        '201':
          description: Event appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: Read the caller's tenant audit events in a time range
      description: |
        Returns the caller's tenant rows whose ts falls in the range, ordered by
        sequence. The rate limiter is fail-open on this operation, so it does not
        return 503 for rate-limit-store outages.
      x-spec-ref: "FROZEN_SPEC_GAL3.md §2 (A2)"
      x-failure-mode: fail-open
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Events in range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/audit/chain/verification:
    get:
      tags: [Audit]
      operationId: verifyAuditChain
      summary: Check the caller's tenant chain in a time range
      description: |
        Walks the tenant chain in sequence order and reports rows that fail either
        check: prev_hash differs from the predecessor's hash (the genesis value for
        the first row), or hash differs from the value recomputed from the row's
        fields. The predecessor of the first row in range is the row with the next
        lower sequence, wherever it falls in time. The rate limiter is fail-open on
        this operation, so it does not return 503 for rate-limit-store outages.
      x-spec-ref: "FROZEN_SPEC_GAL3.md §2 (A3), §3.3 (C6)"
      x-failure-mode: fail-open
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainVerificationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/signatures/sign:
    post:
      tags: [Signatures]
      operationId: signMessage
      summary: Sign a message with Ed25519
      description: |
        The service builds the signed content, the JCS (RFC 8785) serialization of
        {context, nonce, timestamp, message} with context fixed to "gal3-sign", and
        obtains an Ed25519 signature over those bytes from the off-service signing
        authority (HRA) using the current key version. The service-to-HRA interface
        is unspecified (OG-14). The nonce and timestamp are returned so that the
        verifier can rebuild the signed content.
      x-spec-ref: "FROZEN_SPEC_GAL3.md §2 (S1), §6.5"
      x-failure-mode: fail-closed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignRequest'
      responses:
        '200':
          description: Message signed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/signatures/verify:
    post:
      tags: [Signatures]
      operationId: verifySignature
      summary: Verify an Ed25519 signature against a registered key
      description: |
        Looks key_id up in the trust anchors registry (specs/TRUST_ANCHORS.md),
        rebuilds the signed content from message, nonce, timestamp and the fixed
        context, and verifies the signature. Callers cannot supply a public key.
        valid = false for a bad signature and, provisionally, for an unknown key_id
        (OG-15). valid = true does not imply the nonce is unused or the timestamp
        acceptable (OG-16).
      x-spec-ref: "FROZEN_SPEC_GAL3.md §2 (S2), §6.6"
      x-failure-mode: fail-closed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Verification outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT signed with EdDSA (Ed25519). Claims: tenant_id, role, sub; they map to the
        OPA input as user.tenant_id, user.role and user.sub. Tokens using any other
        algorithm are rejected. Issuer, audience, expiry rules and key distribution
        are not specified (OG-17).
  parameters:
    From:
      name: from
      in: query
      required: true
      description: Start of the time range, inclusive (provisional, OG-12).
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: true
      description: End of the time range, exclusive (provisional, OG-12).
      schema:
        type: string
        format: date-time
  schemas:
    Sha256Hex:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: SHA-256 digest as 64 lowercase hex characters (FixedString(64)).
    AuditEventCreate:
      type: object
      required: [action, payload]
      description: Request body. It never carries tenant_id; the tenant comes from the token.
      properties:
        action:
          type: string
          description: What was done. Stored in audit_log.action.
        payload:
          type: string
          description: Event detail. Opaque string; content format not specified (OG-12).
    AuditEvent:
      type: object
      required: [tenant_id, sequence, ts, actor, action, payload, prev_hash, hash]
      properties:
        tenant_id:
          type: string
          description: Tenant that owns the row and its chain. Equals the caller's tenant.
        sequence:
          type: integer
          minimum: 0
          description: Position in the tenant chain; monotonic per tenant (UInt64). First value unspecified (OG-18).
        ts:
          type: string
          format: date-time
          description: Server-assigned event time. JSON form used for hashing is unspecified (OG-19).
        actor:
          type: string
          description: The caller's JWT sub claim.
        action:
          type: string
        payload:
          type: string
        prev_hash:
          allOf:
            - $ref: '#/components/schemas/Sha256Hex'
          description: hash of the preceding row in the tenant chain; for the first row, SHA-256 of "GENESIS" (901131d838b17aac0f7885b81e03cbdc9f5157a00343d30ab22083685ed1416a).
        hash:
          allOf:
            - $ref: '#/components/schemas/Sha256Hex'
          description: SHA-256 over the JCS serialization of ts, actor, action, payload and prev_hash.
    AuditEventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
    ChainBreak:
      type: object
      required: [sequence, ts, actor, prev_hash, hash, reason]
      description: A row that failed a chain check.
      properties:
        sequence:
          type: integer
          minimum: 0
        ts:
          type: string
          format: date-time
        actor:
          type: string
        prev_hash:
          $ref: '#/components/schemas/Sha256Hex'
        hash:
          $ref: '#/components/schemas/Sha256Hex'
        reason:
          type: string
          enum: [prev_hash_mismatch, hash_mismatch]
          description: Which check failed. Values are provisional (OG-12).
    ChainVerificationResult:
      type: object
      required: [intact, breaks]
      properties:
        intact:
          type: boolean
          description: True when breaks is empty.
        breaks:
          type: array
          items:
            $ref: '#/components/schemas/ChainBreak'
    SignRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Message to sign, carried as a JSON string inside the signed content.
    SignResponse:
      type: object
      required: [signature, key_id, nonce, timestamp]
      properties:
        signature:
          type: string
          pattern: '^[0-9a-f]{128}$'
          description: Ed25519 signature, 64 bytes as 128 lowercase hex characters.
        key_id:
          type: string
          description: Version of the signing key; resolvable in the trust anchors registry. Format unspecified (OG-15).
        nonce:
          type: string
          format: uuid
          description: UUID v4 generated at signing time.
        timestamp:
          type: string
          description: ISO 8601 time generated at signing time. Carried verbatim to the verifier.
    VerifyRequest:
      type: object
      required: [message, nonce, timestamp, signature, key_id]
      properties:
        message:
          type: string
          description: The message as signed.
        nonce:
          type: string
          format: uuid
          description: As returned by the sign endpoint.
        timestamp:
          type: string
          description: As returned by the sign endpoint, verbatim.
        signature:
          type: string
          pattern: '^[0-9a-f]{128}$'
          description: Ed25519 signature as 128 lowercase hex characters.
        key_id:
          type: string
          description: Key version to resolve in the trust anchors registry. Callers cannot supply a public key.
    VerifyResponse:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
          description: |
            True when the signature is consistent with the message, nonce and
            timestamp under a registered key. False for a bad signature and,
            provisionally, for an unknown key_id (OG-15). Says nothing about nonce
            reuse or timestamp freshness (OG-16).
    Error:
      type: object
      required: [message]
      description: Provisional error body (OG-12).
      properties:
        message:
          type: string
  responses:
    BadRequest:
      description: Malformed request, including values that violate the hex or length rules.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid JWT.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        The OPA decision was not allow. For a tenant mismatch the policy's deny set
        contains "cross-tenant access denied".
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: cross-tenant access denied
    TooManyRequests:
      description: Rate limiter returned allowed = 0 (token bucket empty).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Rate-limit store unavailable on a fail-closed operation (A1, S1, S2).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
